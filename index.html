<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CulturaBot Futuristic AI Guide</title>
  <style>
    :root {
      --bg-color: #030712;
      --card-bg: #111827;
      --accent-cyan: #06b6d4;
      --accent-blue: #3b82f6;
      --text-color: #f9fafb;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      overflow: hidden;
    }

    /* Header & Pilihan Bahasa */
    .header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      border: 1px solid #1f2937;
      border-radius: 16px;
    }

    .lang-btn {
      background: #1f2937;
      color: var(--accent-cyan);
      border: 1px solid var(--accent-cyan);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Visual Robot Futuristik (SVG Container) */
    .avatar-container {
      position: relative;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 10px 0;
    }

    .robot-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 15px rgba(6, 182, 212, 0.4));
      transition: all 0.3s ease;
    }

    /* Animasi Berfikir (Ring Rotation) */
    .scan-ring {
      position: absolute;
      width: 220px;
      height: 220px;
      border: 2px dashed var(--accent-cyan);
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .thinking .scan-ring {
      opacity: 1;
      animation: spin 3s linear infinite;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .status-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 18px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid var(--accent-cyan);
      color: var(--accent-cyan);
      border-radius: 20px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    /* Dialog Box */
    .dialog-box {
      width: 100%;
      min-height: 130px;
      background: var(--card-bg);
      border: 1px solid #374151;
      border-radius: 20px;
      padding: 20px;
      font-size: 20px;
      line-height: 1.5;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
    }

    /* Panel Kawalan Interaktif */
    .control-panel {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-action {
      background: #1f2937;
      color: white;
      border: 1px solid #374151;
      padding: 16px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-action:active {
      transform: scale(0.97);
      border-color: var(--accent-cyan);
    }

    .btn-ask {
      grid-column: span 2;
      background: linear-gradient(135deg, #0284c7, #0d9488);
      border: none;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(13, 148, 136, 0.3);
    }
  </style>
</head>
<body>

  <!-- 1. Header -->
  <div class="header">
    <span style="font-weight: bold; font-size: 18px; letter-spacing: 1px; color: var(--accent-cyan);">CYBER-GUIDE v2.0</span>
    <button class="lang-btn" id="langBtn" onclick="toggleLanguage()">Bahasa: BM</button>
  </div>

  <!-- 2. Futuristic Robot Avatar (SVG) -->
  <div class="avatar-container" id="avatarContainer">
    <div class="scan-ring"></div>
    <svg class="robot-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
      <!-- Outer Helmet / Head Frame -->
      <rect x="35" y="40" width="130" height="110" rx="24" fill="#111827" stroke="#374151" stroke-width="4"/>
      <path d="M60 30 L140 30" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
      <circle cx="100" cy="25" r="5" fill="#06b6d4"/>

      <!-- Visor Screen -->
      <rect x="48" y="58" width="104" height="74" rx="14" fill="#030712" stroke="#1f2937" stroke-width="2"/>

      <!-- Robot Eyes (Cyan Neon Glow) -->
      <circle id="eyeLeft" cx="78" cy="88" r="10" fill="#374151"/>
      <circle id="eyeRight" cx="122" cy="88" r="10" fill="#374151"/>

      <!-- Mouth / Equalizer Line -->
      <path id="mouthLine" d="M 80 115 L 120 115" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>

  <!-- Status Indicator -->
  <div class="status-badge" id="statusBadge">SYSTEM IDLE</div>

  <!-- 3. Kotak Teks Penerangan -->
  <div class="dialog-box" id="dialogBox">
    Sistem CulturaBot sedia. Dekati robot atau tekan butang di bawah.
  </div>

  <!-- 4. Panel Kawalan -->
  <div class="control-panel">
    <button class="btn-action" onclick="simulateVisitor()">👀 Kesan Pelawat</button>
    <button class="btn-action" onclick="selectArtifact('A Famosa')">🏰 A Famosa</button>
    <button class="btn-action" onclick="selectArtifact('Muzium Samudera')">⛵ Muzium Samudera</button>
    <button class="btn-action" onclick="selectArtifact('Stadthuys')">🏛️ Stadthuys</button>
    
    <button class="btn-action btn-ask" onclick="askCulturaBot()">💬 ASK CULTURABOT (AI)</button>
  </div>

<script>
  const GEMINI_API_KEY = "MASUKKAN_GEMINI_API_KEY_ANDA";
  let currentLang = "ms-MY";

  // 1. Tukar Bahasa
  function toggleLanguage() {
    const btn = document.getElementById('langBtn');
    if (currentLang === "ms-MY") {
      currentLang = "en-US";
      btn.innerText = "Lang: EN";
      updateDialog("Language set to English!");
    } else {
      currentLang = "ms-MY";
      btn.innerText = "Bahasa: BM";
      updateDialog("Bahasa ditukar ke Bahasa Melayu!");
    }
  }

  // 2. Kawalan Visual Avatar Futuristik (Bukan Smiley)
  function setRobotState(state) {
    const eyeLeft = document.getElementById('eyeLeft');
    const eyeRight = document.getElementById('eyeRight');
    const mouthLine = document.getElementById('mouthLine');
    const statusBadge = document.getElementById('statusBadge');
    const container = document.getElementById('avatarContainer');

    container.classList.remove('thinking');

    if (state === "SLEEP") {
      eyeLeft.setAttribute('fill', '#374151');
      eyeRight.setAttribute('fill', '#374151');
      mouthLine.setAttribute('stroke', '#374151');
      statusBadge.innerText = "STANDBY MODE";
    } 
    else if (state === "ACTIVE") {
      eyeLeft.setAttribute('fill', '#06b6d4');
      eyeRight.setAttribute('fill', '#06b6d4');
      mouthLine.setAttribute('stroke', '#06b6d4');
      statusBadge.innerText = "VISITOR DETECTED";
    } 
    else if (state === "THINKING") {
      eyeLeft.setAttribute('fill', '#3b82f6');
      eyeRight.setAttribute('fill', '#3b82f6');
      mouthLine.setAttribute('stroke', '#3b82f6');
      container.classList.add('thinking');
      statusBadge.innerText = "PROCESSING AI...";
    } 
    else if (state === "SPEAKING") {
      eyeLeft.setAttribute('fill', '#10b981');
      eyeRight.setAttribute('fill', '#10b981');
      mouthLine.setAttribute('stroke', '#10b981');
      statusBadge.innerText = "TRANSMITTING AUDIO";
    }
  }

  function updateDialog(text) {
    document.getElementById('dialogBox').innerText = text;
  }

  // 3. Simulasi Pelawat Mendekat
  function simulateVisitor() {
    setRobotState("ACTIVE");
    updateDialog("Selamat datang ke Galeri Warisan. Sila pilih artifak atau ajukan soalan!");
    speakText(currentLang === "ms-MY" ? "Selamat datang ke galeri warisan." : "Welcome to the Heritage Gallery.");
  }

  // 4. Pilih Artifak
  function selectArtifact(name) {
    setRobotState("THINKING");
    updateDialog(`Memproses maklumat mengenai ${name}...`);
    
    const prompt = currentLang === "ms-MY" 
      ? `Berikan fakta menarik 2 ayat tentang ${name} Melaka untuk pelawat muzium.`
      : `Give a 2-sentence interesting fact about ${name} Melaka for museum visitors.`;

    fetchGeminiResponse(prompt);
  }

  // 5. Soal Jawab AI
  function askCulturaBot() {
    const userQuery = prompt(currentLang === "ms-MY" ? "Tanya soalan kepada CulturaBot:" : "Ask CulturaBot a question:");
    if (!userQuery) return;

    setRobotState("THINKING");
    updateDialog(`Menganalisis soalan: "${userQuery}"...`);

    const prompt = currentLang === "ms-MY"
      ? `Anda ialah CulturaBot, pemandu muzium mesra. Jawab soalan ini dalam 2 ayat ringkas: ${userQuery}`
      : `You are CulturaBot, a friendly museum guide. Answer this question in 2 short sentences: ${userQuery}`;

    fetchGeminiResponse(prompt);
  }

  // 6. Panggil Gemini API
  async function fetchGeminiResponse(promptText) {
    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
      });

      const data = await response.json();
      const reply = data.candidates[0].content.parts[0].text;

      updateDialog(reply);
      setRobotState("SPEAKING");
      speakText(reply);

    } catch (err) {
      console.error(err);
      updateDialog("Sistem gagal menghubungi pelayan AI. Semak API Key anda.");
      setRobotState("ACTIVE");
    }
  }

  // 7. Suara Audio iPad
  function speakText(text) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = currentLang;
    utterance.rate = 0.95;
    
    utterance.onend = () => {
      setRobotState("ACTIVE");
    };

    window.speechSynthesis.speak(utterance);
  }

  // Tetapkan mod permulaan ke Standby
  setRobotState("SLEEP");
</script>

</body>
</html>
